<!DOCTYPE html>
<html lang="en">

<head>

            font-variation-settings: "wdth" 100;

        html {

            }

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="A cosy word guessing game." />
    <title>Kibly</title>
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="icon" href="/icons/kibly-icon-192.png" />

    <meta property="og:site_name" content="Kibly" />

    <meta name="twitter:description" content="A cosy word guessing game." />
